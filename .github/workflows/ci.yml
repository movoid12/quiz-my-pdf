name: CI Workflow - Lint, Format, and Security Checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/setup@v3
        with:
          version: 12.8.1
          runtime: node@24
          run_install: false

      - name: Check dependencies Security (high severity) 🔒
        run: pnpm audit --audit-level high

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        run: biome ci .
