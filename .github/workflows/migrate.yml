name: Database Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm 📦
        uses: pnpm/setup@v3
        with:
          version: 12.8.1
          runtime: node@24
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        run: pnpm exec drizzle-kit migrate --config drizzle.migrate.config.ts
        env:
          # Neon: use the direct (non-pooler) connection string for migrations.
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
