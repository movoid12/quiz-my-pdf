minimumReleaseAge: 1440
blockExoticSubdeps: true

pmOnFail: error

overrides:
  better-auth@<1.6.13: ^1.6.13
  better-call: 1.3.7
  drizzle-orm@<0.45.2: '>=0.45.2'
  lodash-es@>=4.0.0 <=4.17.22: '>=4.18.1'
  lodash@>=4.0.0 <=4.17.22: '>=4.18.1'
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  tar@<7.5.7: '>=7.5.7'
  undici@>=7.0.0 <7.18.2: '>=7.28.0'

allowBuilds:
  '@prisma/client': true
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
