minimumReleaseAge: 1440
blockExoticSubdeps: true

pmOnFail: error

allowBuilds:
  '@prisma/client': true
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@ai-sdk/*'
  - 'ai'
  - esbuild@0.24.3
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
  - '@types/node@26.2.0'
  - '@types/pg@8.21.0'
  - nanoid@3.3.18
  - '@better-auth/core@1.7.6'
  - '@better-auth/drizzle-adapter@1.7.6'
  - '@better-auth/kysely-adapter@1.7.6'
  - '@better-auth/memory-adapter@1.7.6'
  - '@better-auth/mongo-adapter@1.7.6'
  - '@better-auth/prisma-adapter@1.7.6'
  - '@better-auth/telemetry@1.7.6'
  - better-auth@1.7.6

overrides:
  better-auth@>=1.1.3 <1.6.22: ^1.6.22
  drizzle-orm@<0.45.2: ^0.45.2
  lodash@>=4.0.0 <=4.17.23: ^4.17.24
  nanoid@<3.3.18: ^3.3.18
  undici@<6.27.0: ^6.27.0
