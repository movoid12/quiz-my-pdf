feature:
  name: improve-start-page-ui
  product: quiz-my-pdf
  description: Add a scroll-expanding visual treatment to the homepage before login.

components:
  HOMEPAGE:
    requirements:
      1: The home page includes a visual that expands as the visitor scrolls.
      2: The home page retains its existing introduction and path to starting a quiz.

constraints:
    IMPLEMENTATION:
    description: Keep the change within the existing homepage implementation.
    requirements:
      1: The scroll expansion works without adding a new dependency.
